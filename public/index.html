<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<title>Home</title>
<style>
  :root {
    --bg0: #0b1020;
    --bg1: #0e1530;
    --text: #eef2ff;
    --muted: #97a3c4;
    --card-border: rgba(255,255,255,.08);
    --accent: #6aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    font-size: 18px;
    background: var(--bg0);
    position: relative;
    overflow-x: hidden;
  }
  /* Animated colour-mesh background */
  .mesh { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg0); }
  .blob { position: absolute; width: 55vw; height: 55vw; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite; }
  .blob.b1 { background: #3b5bff; top: -12vw; left: -8vw; }
  .blob.b2 { background: #c44bff; bottom: -16vw; right: -6vw; animation-duration: 32s; }
  .blob.b3 { background: #00c2a8; top: 30vh; right: 18vw; animation-duration: 38s; opacity: .4; }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(6vw, 4vh) scale(1.12); }
    66%     { transform: translate(-5vw, -3vh) scale(.94); }
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: .55rem 1.4rem;
    backdrop-filter: blur(10px);
    background: linear-gradient(180deg, rgba(12,18,40,.6), rgba(12,18,40,.15));
    border-bottom: 1px solid var(--card-border);
  }
  .clock { display: flex; align-items: baseline; gap: .6rem; }
  .clock .time { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
  .clock .date { color: var(--muted); font-size: .9rem; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: .7rem; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .toggle {
    font-family: inherit; font-size: .82rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 999px; padding: .22rem .8rem;
    transition: color .2s, border-color .2s, background .2s;
  }
  .toggle:hover { color: var(--text); }
  .toggle.active {
    color: #fff; border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 22%, transparent);
  }

  main { padding: 1.1rem 1.4rem 2rem; }
  .grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(4, 1fr); }
  .grid.lists { grid-template-columns: repeat(2, 1fr); margin-top: 1.2rem; }
  .grid.sliders { grid-template-columns: repeat(2, 1fr); margin-top: 1.2rem; }

  .card {
    position: relative; border-radius: 20px; padding: 1rem 1.2rem;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(14px);
    overflow: hidden;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .card::after {
    content: ""; position: absolute; top: -40%; right: -20%; width: 60%; height: 120%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 38%, transparent), transparent);
    opacity: .5; pointer-events: none;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card.big { grid-column: span 2; }
  .card.small { grid-column: span 1; }
  .card.weather { grid-column: span 2; }
  .grid.lists .card { grid-column: span 1; }
  .card.unavailable { opacity: .5; filter: grayscale(.5); }
  .card.missing { --accent: #ff6b6b; }
  /* Hidden-by-showIf cards, revealed via the toggle */
  .card.ghost { opacity: .55; border-style: dashed; }
  .card.ghost .tag {
    margin-left: .4rem; font-size: .62em; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 6px; padding: .05em .4em;
  }

  .head { display: flex; align-items: center; gap: .55rem; position: relative; z-index: 1; }
  .title { font-weight: 650; font-size: 1.15rem; letter-spacing: .01em; }
  .card.big .title, .card.weather .title { font-size: 1.35rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #5a6678; flex: none;
    box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  .dot.ok { background: #36d399; box-shadow: 0 0 10px 1px rgba(54,211,153,.7); }
  .dot.warn { background: #ffd166; box-shadow: 0 0 10px 1px rgba(255,209,102,.7); }
  .dot.bad { background: #ff6b6b; box-shadow: 0 0 10px 1px rgba(255,107,114,.7); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* centered titles for big / small / weather */
  .card.big .head, .card.small .head, .card.weather .head { justify-content: center; text-align: center; }

  .value { font-variant-numeric: tabular-nums; font-weight: 750; }
  .unit { color: var(--muted); font-weight: 500; font-size: .55em; margin-left: .15em; }

  /* Single (big/small) */
  .single { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    margin-top: .4rem; }
  .card.small .single { min-height: 46px; }
  .card.small .single .value { font-size: 2.4rem; }
  .card.big .single { min-height: 96px; }
  .card.big .single .value { font-size: 4.6rem; line-height: 1; }
  .single .wx { width: 56px; height: 56px; }
  .card.big .single .wx { width: 92px; height: 92px; }

  /* Weather: title on top, temp + symbol on one centered line */
  .wline { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    gap: 1.1rem; margin-top: .3rem; min-height: 92px; }
  .wline .value { font-size: 4.4rem; line-height: 1; }
  .wline .wx { width: 92px; height: 92px; }

  /* List: title, dot, value(s) on one line */
  .lrow { display: flex; align-items: center; gap: .6rem; position: relative; z-index: 1; }
  .lrow .vals { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
  .lrow .value { font-size: 1.5rem; }
  .lrow .wx { width: 34px; height: 34px; }

  .wx { display: inline-block; vertical-align: middle; filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
  .pill { padding: .2rem .8rem; border-radius: 999px; font-size: .85em; font-weight: 700;
    display: inline-block; }
  .single .pill { font-size: 1.6rem; padding: .4rem 1.2rem; }
  .pill.on  { background: rgba(54,211,153,.18);  color: #4ade9e; box-shadow: inset 0 0 0 1px rgba(54,211,153,.4); }
  .pill.off { background: rgba(120,132,156,.18); color: #aab4cc; box-shadow: inset 0 0 0 1px rgba(120,132,156,.35); }
  .pill.alarm { background: rgba(255,107,114,.18); color: #ff8a90; box-shadow: inset 0 0 0 1px rgba(255,107,114,.45); }

  /* ---- Slider (writable) ------------------------------------------------ */
  .card.slider { grid-column: span 1; padding: .9rem 1.1rem 1rem; }
  .card.slider .head { justify-content: flex-start; }
  .card.slider .pos { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 750; font-size: 1.9rem; line-height: 1; color: var(--accent); }
  .card.slider .pos .unit { font-size: .5em; }
  .card.slider .pos.stale { opacity: .6; }
  .card.slider .live { color: var(--muted); font-size: .8rem; margin-left: .45rem;
    font-variant-numeric: tabular-nums; }

  /* Custom track: the Nest Hub handles pointer events on a div far better
     than dragging a native <input type=range>, and tapping the track works. */
  .track { position: relative; z-index: 2; margin: .85rem 0 .3rem; height: 46px;
    border-radius: 14px; background: rgba(255,255,255,.09);
    box-shadow: inset 0 0 0 1px var(--card-border);
    touch-action: none; cursor: pointer; overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; width: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent),
      color-mix(in srgb, var(--accent) 80%, transparent));
    transition: width .18s ease; }
  .track.dragging .fill, .track.dragging .knob { transition: none; }
  .track .knob { position: absolute; top: 50%; left: 0; width: 8px; height: 30px;
    margin-left: -4px; border-radius: 4px; background: #fff; transform: translateY(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,.5); transition: left .18s ease; }

  /* The track is the whole control; this row is only the status line. It keeps a
     fixed height so the card doesn't jump when a message appears or clears. */
  .srow { display: flex; align-items: center; position: relative; z-index: 2;
    min-height: 1.15rem; }
  .sstat { margin-left: auto; font-size: .78rem; color: var(--muted); text-align: right;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sstat.err { color: #ff8a90; }

  /* Config problem, shown without blanking a wall display that still works */
  .banner { margin: 1rem 1.4rem -.2rem; padding: .7rem 1rem; border-radius: 12px;
    font-size: .9rem; line-height: 1.45; color: #ffc9cc;
    background: rgba(255,107,114,.12); border: 1px solid rgba(255,107,114,.35);
    border-left: 4px solid #ff6b6b; }
  .banner[hidden] { display: none; }

  .muted { color: var(--muted); font-size: .9rem; }
  .error { color: #ff8a90; }
  .notice { border-radius: 18px; padding: 1.4rem 1.6rem; line-height: 1.6; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border); }
  .notice code { color: var(--accent); }
</style>
</head>
<body>
  <div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <header>
    <div class="clock"><span class="time" id="clock">--:--</span><span class="date" id="date"></span></div>
    <div class="meta">
      <span id="status">Loading…</span>
      <button id="toggleHidden" class="toggle" type="button">Vis skjulte</button>
      <a href="discover.html">Alle enheter</a>
    </div>
  </header>
  <div id="cfgwarn" class="banner" hidden></div>
  <main id="main"></main>

<script src="weather-symbols.js"></script>
<script>
const REFRESH_MS = 5000;
const SIZES = ['big', 'small', 'list', 'weather', 'slider'];
// How long to keep showing the position we commanded while the screens travel
// there, before trusting the live reading again.
const PENDING_MS = 25000;
const main = document.getElementById('main');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggleHidden');
const warnEl = document.getElementById('cfgwarn');

// A config.json problem the dashboard is surviving: the cards below are live
// readings, but the card *list* is whatever last parsed.
function setConfigWarning(msg) {
  warnEl.textContent = msg ? `Viser lagret oppsett — ${msg}` : '';
  warnEl.hidden = !msg;
}

// Reveal cards normally hidden by their showIf rule (disregards showIf).
let showHidden = localStorage.getItem('showHidden') === '1';
function syncToggle() {
  toggleBtn.classList.toggle('active', showHidden);
  toggleBtn.textContent = showHidden ? 'Skjul skjulte' : 'Vis skjulte';
}
toggleBtn.addEventListener('click', () => {
  showHidden = !showHidden;
  localStorage.setItem('showHidden', showHidden ? '1' : '0');
  syncToggle();
  lastSig = null;   // force a rebuild
  tick();
});
syncToggle();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- Clock ---------------------------------------------------------------
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('date').textContent =
    d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}

// ---- Colours -------------------------------------------------------------
function accentFor(id) {
  if (!id) return '#6aa3ff';
  if (id.startsWith('alarm_')) return '#ff6b6b';
  if (id === 'onoff') return '#36d399';
  if (id.startsWith('measure_humidity')) return '#4cc9f0';
  if (id.includes('power') || id.includes('measure_current') || id.includes('voltage')) return '#b56bff';
  if (id.startsWith('measure_co2')) return '#2ec4b6';
  if (id.startsWith('measure_luminance')) return '#ffd166';
  if (id.startsWith('measure_temperature') || id === 'target_temperature') return '#ff9f43';
  if (id === 'weather_description') return '#5eb3ff';
  if (id.startsWith('windowcoverings')) return '#ffb457';
  return '#6aa3ff';
}
function tempColor(v) {
  if (v <= 0) return '#5eb3ff';
  if (v <= 10) return '#36d3c0';
  if (v <= 18) return '#48d39a';
  if (v <= 24) return '#ffd166';
  if (v <= 29) return '#ff9f43';
  return '#ff6b6b';
}
function valueColor(cap) {
  if ((cap.id.startsWith('measure_temperature') || cap.id === 'target_temperature')
      && typeof cap.value === 'number') return tempColor(cap.value);
  return accentFor(cap.id);
}

// ---- Enum value labels ---------------------------------------------------
// Homey reports enum capabilities as their *id* ("docked"), and the app's own
// titles are English. This maps id -> Norwegian for display only: showIf still
// matches the raw id server-side, so config.json keeps working unchanged.
// Add a capability here to translate it; unknown values fall through verbatim.
const VALUE_LABELS = {
  mower_state: {
    idle: 'Venter',
    mowing: 'Klipper',
    paused: 'Pauset',
    docked: 'I dokken',
    charging: 'Lader',
    returning: 'På vei hjem',
    error: 'Feil',
    unknown: 'Ukjent',
  },
};

function valueLabel(capId, v) {
  const map = VALUE_LABELS[capId];
  if (!map || typeof v !== 'string') return v;
  const hit = map[v.trim().toLowerCase()];
  return hit === undefined ? v : hit;
}

// ---- Weather icon (reuse window.WX from weather-symbols.js) ---------------
function isDaytime() { const h = new Date().getHours(); return h >= 6 && h < 21; }
function weatherIcon(rawValue) {
  if (rawValue === null || rawValue === undefined || !window.WX) return null;
  let v = String(rawValue).trim().toLowerCase();
  if (!v) return null;
  let dn = null;
  const m = v.match(/_(day|night|polartwilight)$/);
  if (m) { dn = m[1]; v = v.replace(/_(day|night|polartwilight)$/, ''); }
  const descKey = v.replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
  const codeKey = v.replace(/[\s._]+/g, '');
  const base = window.WX.map[descKey] || window.WX.map[codeKey];
  if (!base) return null;
  let file = base;
  if (window.WX.variants.includes(base)) {
    const day = dn ? dn !== 'night' : isDaytime();
    file = base + (day ? 'd' : 'n');
  }
  return { file, label: rawValue };
}

function fmtValue(cap, cls) {
  const v = cap.value;
  if (cap.id === 'weather_description') {
    const icon = weatherIcon(v);
    if (icon) {
      const lbl = escapeHtml(icon.label);
      return `<img class="wx ${cls || ''}" src="icons/weather/${icon.file}.svg" alt="${lbl}" title="${lbl}">`;
    }
  }
  if (v === null || v === undefined) return `<span class="value" style="color:var(--muted)">—</span>`;
  if (typeof v === 'boolean') {
    const isAlarm = cap.id.startsWith('alarm_');
    if (isAlarm) return v ? '<span class="pill alarm">Alarm</span>' : '<span class="pill off">Clear</span>';
    return v ? '<span class="pill on">Ja</span>' : '<span class="pill off">Nei</span>';
  }
  if (typeof v === 'number') {
    const num = Number.isInteger(v) ? v : v.toFixed(1);
    const unit = cap.units ? `<span class="unit">${escapeHtml(cap.units)}</span>` : '';
    return `<span class="value" style="color:${valueColor(cap)}">${num}${unit}</span>`;
  }
  return `<span class="value" style="color:${valueColor(cap)}">${escapeHtml(String(valueLabel(cap.id, v)))}</span>`;
}

// ---- Sliders -------------------------------------------------------------
// Per-card UI state. `shown` is what the thumb sits at, `pending` is a position
// we have commanded and are waiting for the screens to reach. Neither is ever
// overwritten by the 5 s poll while the user has a finger down.
const sliders = {};        // key -> { spec, shown, pending, pendingAt, drag, busy, seq, msg, err }
let lastSliderEnt = {};    // key -> latest slider entity from /api/state

function sliderState(key) {
  if (!sliders[key]) {
    sliders[key] = { spec: null, shown: 0, pending: null, pendingAt: 0,
                     drag: false, busy: false, seq: 0, msg: '', err: false };
  }
  return sliders[key];
}

// Snap to the step grid, but keep the exact limits reachable: with step 5 and
// max 97, dragging to the far end must give 97, not 95.
function snap(v, spec) {
  if (v <= spec.min) return spec.min;
  if (v >= spec.max) return spec.max;
  const stepped = Math.round(v / spec.step) * spec.step;
  return Math.min(spec.max, Math.max(spec.min, Math.round(stepped * 10) / 10));
}

function pctFromEvent(track, clientX) {
  const r = track.getBoundingClientRect();
  if (!r.width) return 0;
  return ((clientX - r.left) / r.width) * 100;
}

// Send the position. A per-card sequence number means a slow response from an
// earlier drag can never clobber a newer one.
async function commit(key) {
  const st = sliderState(key);
  if (!st.spec) return;
  const target = st.shown;
  const seq = ++st.seq;
  st.pending = target;
  st.pendingAt = Date.now();
  st.busy = true;
  st.err = false;
  st.msg = 'Sender…';
  paintAllSliders();

  try {
    const res = await fetch('api/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, position: target }),
      cache: 'no-store',
    });
    const data = await res.json().catch(() => ({}));
    if (seq !== st.seq) return;               // superseded by a newer drag
    st.busy = false;
    // A response that lands while a finger is down must not move the thumb —
    // report the outcome, but leave the position the user is choosing alone.
    if (!res.ok || data.ok === false) {
      st.err = true;
      st.msg = data.error ? String(data.error).slice(0, 90) : `Feil (HTTP ${res.status})`;
      if (!st.drag) st.pending = null;         // fall back to the live reading
    } else {
      if (!st.drag && typeof data.position === 'number') { st.pending = data.position; st.shown = data.position; }
      const failed = (data.results || []).filter(r => !r.ok);
      st.err = failed.length > 0;
      // On success the "på vei" readout below is the feedback, so no message.
      st.msg = failed.length
        ? `${failed[0].name || 'Enhet'}: ${failed[0].error}`.slice(0, 90) +
          (failed.length > 1 ? ` (+${failed.length - 1})` : '')
        : '';
    }
  } catch (err) {
    if (seq !== st.seq) return;
    st.busy = false; st.err = true;
    if (!st.drag) st.pending = null;
    st.msg = 'Ingen forbindelse';
  }
  paintAllSliders();
  tick();
}

// Drag / tap on the track. Listeners live on the document so cards can be
// rebuilt without rebinding anything.
let dragKey = null;

function onDown(ev) {
  const track = ev.target.closest && ev.target.closest('.track[data-key]');
  if (!track) return;
  const key = track.dataset.key;
  const st = sliderState(key);
  if (!st.spec) return;
  dragKey = key;
  st.drag = true;
  st.shown = snap(pctFromEvent(track, ev.clientX), st.spec);
  track.classList.add('dragging');
  if (track.setPointerCapture && ev.pointerId !== undefined) {
    try { track.setPointerCapture(ev.pointerId); } catch {}
  }
  ev.preventDefault();
  paintAllSliders();
}

function onMove(ev) {
  if (!dragKey) return;
  const st = sliderState(dragKey);
  const track = document.querySelector(`.track[data-key="${dragKey}"]`);
  if (!track || !st.spec) return;
  st.shown = snap(pctFromEvent(track, ev.clientX), st.spec);
  ev.preventDefault();
  paintAllSliders();
}

function onUp() {
  if (!dragKey) return;
  const key = dragKey;
  dragKey = null;
  const st = sliderState(key);
  st.drag = false;
  const track = document.querySelector(`.track[data-key="${key}"]`);
  if (track) track.classList.remove('dragging');
  commit(key);                               // one command, on release
}

if (window.PointerEvent) {
  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
} else {
  // Older cast/webview runtimes without Pointer Events.
  document.addEventListener('touchstart', (e) => onDown(Object.assign({}, e, {
    target: e.target, clientX: e.touches[0].clientX, preventDefault: () => e.preventDefault() })));
  document.addEventListener('touchmove', (e) => onMove({
    clientX: e.touches[0].clientX, preventDefault: () => e.preventDefault() }));
  document.addEventListener('touchend', onUp);
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Static skeleton — values are filled in by paintSlider so the card never gets
// its innerHTML replaced under a moving finger.
function renderSlider(ent) {
  const title = escapeHtml(ent.label);
  const key = escapeHtml(ent.key);
  return `<div class="head">
      <span class="title">${title}</span>
      <span class="pos">—</span>
      ${dot(ent)}
    </div>
    <div class="track" data-key="${key}">
      <div class="fill"></div>
      <div class="knob"></div>
    </div>
    <div class="srow">
      <span class="sstat"></span>
    </div>`;
}

// Reconcile one slider card against the latest server reading.
function paintSlider(el, ent) {
  const st = sliderState(ent.key);
  st.spec = { min: ent.min, max: ent.max, step: ent.step };
  const live = typeof ent.position === 'number' ? ent.position : null;

  if (!st.drag) {
    if (st.pending !== null) {
      const tol = Math.max(st.spec.step, 3);
      const arrived = live !== null && Math.abs(live - st.pending) <= tol;
      if (arrived || Date.now() - st.pendingAt > PENDING_MS) {
        st.pending = null;
        if (live !== null) st.shown = live;
      }
    } else if (live !== null) {
      st.shown = live;
    }
  }

  const shown = snap(st.shown, st.spec);
  const posEl = el.querySelector('.pos');
  const fill = el.querySelector('.fill');
  const knob = el.querySelector('.knob');
  const stat = el.querySelector('.sstat');
  if (!posEl || !fill || !knob) return;

  // Slider cards are never re-rendered, so the dot has to be nudged here or it
  // stays frozen at whatever it was when the card was first built.
  const dotEl = el.querySelector('.dot');
  if (dotEl) {
    const cls = 'dot ' + dotClass(ent);
    if (dotEl.className !== cls) dotEl.className = cls;
    const title = dotTitle(ent);
    if (dotEl.title !== title) dotEl.title = title;
  }

  posEl.innerHTML = `${Math.round(shown)}<span class="unit">%</span>`;
  posEl.classList.toggle('stale', st.pending !== null || st.drag);
  fill.style.width = shown + '%';
  knob.style.left = shown + '%';

  if (stat) {
    let msg = st.msg;
    if (!st.busy && !st.err) {
      if (st.pending !== null) msg = live !== null ? `på vei (${Math.round(live)} %)` : 'på vei';
      else if (ent.mixed) msg = 'ulik posisjon';
      else msg = '';
    }
    const bad = (ent.members || []).filter(m => m.missing || !m.available || m.hasCapability === false);
    if (!msg && bad.length) {
      msg = bad.length === 1
        ? `${bad[0].label || bad[0].name}: utilgjengelig`
        : `${bad.length} utilgjengelige`;
    }
    stat.textContent = msg || '';
    stat.classList.toggle('err', !!st.err);
  }
}

// DOM id for a card. The server's `key` is derived from the entry's position in
// config.json, so it survives cards appearing and disappearing.
function cardId(ent) {
  return 'card-' + String(ent.key).replace(/[^a-zA-Z0-9_-]/g, '-');
}
function cardEl(ent) { return document.getElementById(cardId(ent)); }

function paintAllSliders() {
  for (const ent of Object.values(lastSliderEnt)) {
    const el = cardEl(ent);
    if (el) paintSlider(el, ent);
  }
}

function dot(ent) {
  return `<span class="dot ${dotClass(ent)}" title="${dotTitle(ent)}"></span>`;
}

// Green / amber / red. Amber only ever comes from a multi-device slider card
// where some members are reachable and some are not.
function dotClass(ent) {
  if (ent.missing || ent.available === false) return 'bad';
  if ((ent.capabilities || []).some(c => c.id.startsWith('alarm_') && c.value === true)) return 'bad';
  if (ent.partial) return 'warn';
  return 'ok';
}

function dotTitle(ent) {
  const cls = dotClass(ent);
  if (cls === 'warn') return 'Partly unavailable';
  if (cls === 'ok') return 'Online';
  if ((ent.capabilities || []).some(c => c.id.startsWith('alarm_') && c.value === true) &&
      !ent.missing && ent.available !== false) return 'Alarm';
  return 'Unavailable';
}

function cardAccent(ent) {
  if (ent.missing) return '#ff6b6b';
  if (ent.size === 'slider') return accentFor(ent.capability);
  const caps = ent.capabilities || [];
  const alarm = caps.find(c => c.id.startsWith('alarm_'));
  return accentFor((alarm || caps[0] || {}).id);
}

function cardClass(ent) {
  const size = SIZES.includes(ent.size) ? ent.size : 'small';
  const unavail = ent.available === false ? ' unavailable' : '';
  const ghost = ent.hidden ? ' ghost' : '';
  let base;
  if (ent.missing && size !== 'slider') base = 'card small missing';
  else if (size === 'slider') base = 'card slider' + unavail + (ent.missing ? ' missing' : '');
  else if ((size === 'big' || size === 'small') && (ent.capabilities || []).length === 1) base = 'card single-card ' + size + unavail;
  else if (size === 'weather') base = 'card weather' + unavail;
  else if (size === 'list') base = 'card list' + unavail;
  else base = 'card ' + size + unavail;
  return base + ghost;
}

// A small "hidden" tag for revealed cards.
function hiddenTag(ent) { return ent.hidden ? '<span class="tag">hidden</span>' : ''; }

// Inner markup of a card (without the outer .card element), so we can update
// contents in place without re-triggering the card entry animation.
function renderInner(ent) {
  const size = SIZES.includes(ent.size) ? ent.size : 'small';
  const title = escapeHtml(ent.label);

  if (size === 'slider') return renderSlider(ent);
  if (ent.missing) {
    return `<div class="head"><span class="title">${title}</span>${dot(ent)}</div>
      <div class="single"><span class="muted error">Not found (${escapeHtml(ent.deviceId)})</span></div>`;
  }
  if ((size === 'big' || size === 'small') && (ent.capabilities || []).length === 1) {
    return `<div class="head"><span class="title">${title}${hiddenTag(ent)}</span>${dot(ent)}</div>
      <div class="single">${fmtValue(ent.capabilities[0])}</div>`;
  }
  if (size === 'weather') {
    const vals = ent.capabilities.map(c => fmtValue(c)).join('');
    return `<div class="head"><span class="title">${title}${hiddenTag(ent)}</span></div>
      <div class="wline">${vals}</div>`;
  }
  if (size === 'list') {
    const vals = ent.capabilities.length
      ? ent.capabilities.map(c => fmtValue(c)).join('')
      : '<span class="muted">No matching capabilities</span>';
    return `<div class="lrow"><span class="title">${title}${hiddenTag(ent)}</span>${dot(ent)}<span class="vals">${vals}</span></div>`;
  }
  const vals = ent.capabilities.map(c =>
    `<div class="lrow"><span class="muted">${escapeHtml(c.title)}</span><span class="vals">${fmtValue(c)}</span></div>`
  ).join('');
  return `<div class="head"><span class="title">${title}${hiddenTag(ent)}</span>${dot(ent)}</div>
    <div style="margin-top:.5rem;display:flex;flex-direction:column;gap:.45rem">${vals}</div>`;
}

let lastSig = null;       // layout signature: triggers a full rebuild when it changes
let lastInner = {};       // cached inner HTML per card key, to skip no-op updates

// tick() is called on a timer, after every commit, and by the "vis skjulte"
// toggle, so several polls can be in flight at once. Only the newest response is
// allowed to touch the DOM — otherwise a slow earlier one lands last and puts
// stale values back on screen.
let tickSeq = 0;

async function tick() {
  // Never poll mid-drag: a changed layout signature (a showIf card appearing)
  // would rebuild the grid and throw away the card being touched.
  if (dragKey) return;
  const seq = ++tickSeq;
  try {
    const url = 'api/state' + (showHidden ? '?showHidden=1' : '');
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    if (seq !== tickSeq || dragKey) return;   // superseded, or a drag started
    if (data.error) { statusEl.innerHTML = `<span class="error">Homey error: ${escapeHtml(data.error)}</span>`; return; }
    if (!data.configured) {
      setConfigWarning(null);   // the full-page notice below covers it
      main.innerHTML = data.configError
        ? `<div class="notice"><strong class="error">config.json could not be read.</strong><br>
           <code>${escapeHtml(data.configError)}</code><br>
           Fix the file and this page will pick it up within a few seconds.</div>`
        : `<div class="notice"><strong>No dashboard configured yet.</strong><br>
           Create a <code>config.json</code> and list devices. Open
           <a href="discover.html">device discovery</a> to find IDs.</div>`;
      statusEl.innerHTML = data.configError
        ? '<span class="error">Bad config</span>' : 'Not configured';
      lastSig = null;
      lastInner = {};
      return;
    }
    document.title = data.title || 'Home';

    const singles = data.entities.filter(e => e.size !== 'list' && e.size !== 'slider');
    const sliderEnts = data.entities.filter(e => e.size === 'slider');
    const lists = data.entities.filter(e => e.size === 'list');
    const ordered = [...singles, ...sliderEnts, ...lists];

    lastSliderEnt = {};
    for (const e of sliderEnts) lastSliderEnt[e.key] = e;

    // Deliberately value-free: the signature must not change as positions move,
    // or a rebuild would rip the card out from under a finger mid-drag.
    const sig = ordered.map(e =>
      e.key + '|' + e.size + '|' + (e.missing ? 'm' : '') + '|' + (e.hidden ? 'h' : '') +
      '|' + (e.size === 'slider' ? `${e.min}-${e.max}-${e.step}` : '') + '|' +
      (e.capabilities || []).map(c => c.id).join(',')).join('||');

    if (sig !== lastSig) {
      // Structure changed (cards added/removed/reordered): full rebuild (animates once).
      lastInner = {};
      const shell = (e) => {
        const inner = renderInner(e);
        lastInner[e.key] = inner;
        return `<div class="${cardClass(e)}" id="${cardId(e)}" style="--accent:${cardAccent(e)}">${inner}</div>`;
      };
      let html = '';
      if (singles.length) html += `<div class="grid">${singles.map(shell).join('')}</div>`;
      if (sliderEnts.length) html += `<div class="grid sliders">${sliderEnts.map(shell).join('')}</div>`;
      if (lists.length) html += `<div class="grid lists">${lists.map(shell).join('')}</div>`;
      main.innerHTML = html;
      lastSig = sig;
      paintAllSliders();
    } else {
      // Same cards: update contents in place, only when actually changed (no blink).
      for (const e of ordered) {
        const el = cardEl(e);
        if (!el) continue;
        const cls = cardClass(e);
        if (el.className !== cls) el.className = cls;
        el.style.setProperty('--accent', cardAccent(e));
        // Sliders are never re-rendered: paintSlider nudges the few nodes that
        // change, so a drag in progress survives the poll.
        if (e.size === 'slider') { paintSlider(el, e); continue; }
        const inner = renderInner(e);
        if (lastInner[e.key] !== inner) { el.innerHTML = inner; lastInner[e.key] = inner; }
      }
    }
    // Cards are live either way; the banner says so when they came from a cached
    // config.json because the file itself can no longer be read.
    setConfigWarning(data.configWarning);
    statusEl.textContent = `Updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
  } catch (err) {
    statusEl.innerHTML = '<span class="error">Cannot reach server</span>';
  }
}

updateClock();
setInterval(updateClock, 1000);   // live ticking clock (incl. seconds)
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
