<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<title>Home</title>
<style>
  :root {
    --bg0: #0b1020;
    --bg1: #0e1530;
    --text: #eef2ff;
    --muted: #97a3c4;
    --card-border: rgba(255,255,255,.08);
    --accent: #6aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    font-size: 18px;
    background: var(--bg0);
    position: relative;
    overflow-x: hidden;
  }
  /* Animated colour-mesh background */
  .mesh { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg0); }
  .blob { position: absolute; width: 55vw; height: 55vw; border-radius: 50%;
    filter: blur(90px); opacity: .55; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite; }
  .blob.b1 { background: #3b5bff; top: -12vw; left: -8vw; }
  .blob.b2 { background: #c44bff; bottom: -16vw; right: -6vw; animation-duration: 32s; }
  .blob.b3 { background: #00c2a8; top: 30vh; right: 18vw; animation-duration: 38s; opacity: .4; }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(6vw, 4vh) scale(1.12); }
    66%     { transform: translate(-5vw, -3vh) scale(.94); }
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: .55rem 1.4rem;
    backdrop-filter: blur(10px);
    background: linear-gradient(180deg, rgba(12,18,40,.6), rgba(12,18,40,.15));
    border-bottom: 1px solid var(--card-border);
  }
  .clock { display: flex; align-items: baseline; gap: .6rem; }
  .clock .time { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
  .clock .date { color: var(--muted); font-size: .9rem; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: .7rem; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .toggle {
    font-family: inherit; font-size: .82rem; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 999px; padding: .22rem .8rem;
    transition: color .2s, border-color .2s, background .2s;
  }
  .toggle:hover { color: var(--text); }
  .toggle.active {
    color: #fff; border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 22%, transparent);
  }

  main { padding: 1.1rem 1.4rem 1.4rem; }
  .grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(4, 1fr); }
  .grid.lists { grid-template-columns: repeat(2, 1fr); margin-top: 1.2rem; }
  .grid.sliders { grid-template-columns: repeat(2, 1fr); margin-top: 1.2rem; }

  .card {
    position: relative; border-radius: 20px; padding: 1rem 1.2rem;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(14px);
    overflow: hidden;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 55%, transparent), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .card::after {
    content: ""; position: absolute; top: -40%; right: -20%; width: 60%; height: 120%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 38%, transparent), transparent);
    opacity: .5; pointer-events: none;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card.big { grid-column: span 2; }
  .card.small { grid-column: span 1; }
  .card.weather { grid-column: span 2; }
  .grid.lists .card { grid-column: span 1; }
  .card.unavailable { opacity: .5; filter: grayscale(.5); }
  .card.missing { --accent: #ff6b6b; }
  /* Hidden-by-showIf cards, revealed via the toggle */
  .card.ghost { opacity: .55; border-style: dashed; }
  .tag.stale { color: #ffd166; border-color: rgba(255,209,102,.5); }
  .card.ghost .tag, .tag.stale {
    margin-left: .4rem; font-size: .62em; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 6px; padding: .05em .4em;
  }

  .head { display: flex; align-items: center; gap: .55rem; position: relative; z-index: 1; }
  .title { font-weight: 650; font-size: 1.15rem; letter-spacing: .01em; }
  .card.big .title, .card.weather .title { font-size: 1.35rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #5a6678; flex: none;
    box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  .dot.ok { background: #36d399; box-shadow: 0 0 10px 1px rgba(54,211,153,.7); }
  .dot.warn { background: #ffd166; box-shadow: 0 0 10px 1px rgba(255,209,102,.7); }
  .dot.bad { background: #ff6b6b; box-shadow: 0 0 10px 1px rgba(255,107,114,.7); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* centered titles for big / small / weather */
  .card.big .head, .card.small .head, .card.weather .head { justify-content: center; text-align: center; }

  .value { font-variant-numeric: tabular-nums; font-weight: 750; }
  .unit { color: var(--muted); font-weight: 500; font-size: .55em; margin-left: .15em; }

  /* Single (big/small) */
  .single { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    margin-top: .4rem; }
  .card.small .single { min-height: 46px; }
  .card.small .single .value { font-size: 2.4rem; }
  .card.big .single { min-height: 96px; }
  .card.big .single .value { font-size: 4.6rem; line-height: 1; }
  .single .wx { width: 56px; height: 56px; }
  .card.big .single .wx { width: 92px; height: 92px; }

  /* Weather: title on top, temp + symbol on one centered line */
  .wline { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    gap: 1.1rem; margin-top: .3rem; min-height: 92px; }
  .wline .value { font-size: 4.4rem; line-height: 1; }
  .wline .wx { width: 92px; height: 92px; }

  /* List: title, dot, value(s) on one line */
  .lrow { display: flex; align-items: center; gap: .6rem; position: relative; z-index: 1; }
  .lrow .vals { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
  .lrow .value { font-size: 1.5rem; }
  .lrow .wx { width: 34px; height: 34px; }

  .wx { display: inline-block; vertical-align: middle; filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
  .pill { padding: .2rem .8rem; border-radius: 999px; font-size: .85em; font-weight: 700;
    display: inline-block; }
  .single .pill { font-size: 1.6rem; padding: .4rem 1.2rem; }
  .pill.on  { background: rgba(54,211,153,.18);  color: #4ade9e; box-shadow: inset 0 0 0 1px rgba(54,211,153,.4); }
  .pill.off { background: rgba(120,132,156,.18); color: #aab4cc; box-shadow: inset 0 0 0 1px rgba(120,132,156,.35); }
  .pill.alarm { background: rgba(255,107,114,.18); color: #ff8a90; box-shadow: inset 0 0 0 1px rgba(255,107,114,.45); }

  /* ---- Slider (writable) ------------------------------------------------ */
  .card.slider { grid-column: span 1; padding: .7rem 1.1rem .55rem; }
  .card.slider .head { justify-content: flex-start; }
  .card.slider .pos { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 750; font-size: 1.55rem; line-height: 1; color: var(--accent); }
  .card.slider .pos .unit { font-size: .5em; }
  .card.slider .pos.stale { opacity: .6; }
  .card.slider .live { color: var(--muted); font-size: .8rem; margin-left: .45rem;
    font-variant-numeric: tabular-nums; }

  /* Custom track: the Nest Hub handles pointer events on a div far better
     than dragging a native <input type=range>, and tapping the track works. */
  .track { position: relative; z-index: 2; margin: .55rem 0 .25rem; height: 40px;
    border-radius: 14px; background: rgba(255,255,255,.09);
    box-shadow: inset 0 0 0 1px var(--card-border);
    touch-action: none; cursor: pointer; overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; width: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent),
      color-mix(in srgb, var(--accent) 80%, transparent));
    transition: width .18s ease; }
  .track.dragging .fill, .track.dragging .knob { transition: none; }
  .track .knob { position: absolute; top: 50%; left: 0; width: 8px; height: 30px;
    margin-left: -4px; border-radius: 4px; background: #fff; transform: translateY(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,.5); transition: left .18s ease; }

  /* The track is the whole control; this row is only the status line. It keeps a
     fixed height so the card doesn't jump when a message appears or clears. */
  .srow { display: flex; align-items: center; position: relative; z-index: 2;
    min-height: 1rem; }
  .sstat { margin-left: auto; font-size: .78rem; color: var(--muted); text-align: right;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sstat.err { color: #ff8a90; }

  /* ---- Writable cards: switch, track, dial ------------------------------ */
  /* Light and thermostat cards borrow the slider card's metrics, so the three
     controls read as one family. In every one of them the switch is the only
     tap target in the header and the track or dial the only one below it, so a
     finger on one can never move the other. */
  .card.light, .card.thermostat { grid-column: span 1; padding: .7rem 1.1rem .55rem; }
  .card.light .head, .card.thermostat .head { justify-content: flex-start; gap: .38rem; }
  .card.light .title, .card.thermostat .title { font-size: 1rem; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.light .pos { margin-left: auto; font-variant-numeric: tabular-nums;
    font-weight: 750; font-size: 1.35rem; line-height: 1; color: var(--accent); }
  .card.light .pos .unit { font-size: .5em; }
  .card.light .pos.stale { opacity: .6; }
  .card.light .pos.dim-off { color: var(--muted); }
  /* A device the app won't let us write shows its state rather than a control
     that could only ever fail. */
  .card.light .pill.state, .card.thermostat .pill.state { margin-left: auto; }
  /* One row per named channel, each with its own control. */
  .card.light .chans { position: relative; z-index: 2; display: flex; flex-direction: column;
    gap: .45rem; margin-top: .5rem; }
  .card.light .crow { display: flex; align-items: center; gap: .5rem; min-height: 26px; }
  .card.light .crow .cname { color: var(--muted); font-size: .95rem; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.light .crow .sw, .card.light .crow .pill.state { margin-left: auto; }

  /* A lamp with no dimmer is just the header and the status line. */
  .card.light.plain .sw { margin-left: auto; }
  .card.light.plain { padding-bottom: .7rem; }

  .sw { flex: none; position: relative; z-index: 3;
    width: 46px; height: 26px; padding: 0; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--card-border); background: rgba(255,255,255,.10);
    touch-action: manipulation; transition: background .2s, border-color .2s; }
  .sw .kn { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: #b9c4e4; box-shadow: 0 2px 6px rgba(0,0,0,.5);
    transition: left .2s ease, background .2s ease; }
  .sw.on { background: rgba(54,211,153,.34); border-color: rgba(54,211,153,.6); }
  .sw.on .kn { left: 22px; background: #eafff5; }
  .sw.busy { opacity: .55; }
  .sw:disabled { opacity: .35; cursor: default; }

  /* Thermostat dial: a 270-degree arc with the gap at the bottom. */
  .dial { display: block; width: 100%; max-width: 158px; margin: .1rem auto 0;
    position: relative; z-index: 2; touch-action: none; cursor: pointer; }
  .dial .bg { fill: none; stroke: rgba(255,255,255,.10); stroke-linecap: round; }
  .dial .val { fill: none; stroke-linecap: round;
    transition: stroke-dashoffset .18s ease, stroke .2s ease; }
  .dial .knob { transition: cx .18s ease, cy .18s ease; }
  .dial.dragging .val, .dial.dragging .knob { transition: none; }
  .dial .num { text-anchor: middle; font-variant-numeric: tabular-nums; font-weight: 750; }
  .dial .deg { text-anchor: middle; fill: var(--muted); font-weight: 600; }
  .dial.pend .num { opacity: .62; }
  .dial.off .bg { stroke: rgba(255,255,255,.06); }

  /* Extra pages (one per room display) size themselves to whatever screen they
     are on, rather than to the kitchen page's fixed 4-column 1024x600 grid. */
  body.subpage .grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  body.subpage .grid.sliders { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  body.subpage .grid.lists { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  /* A room panel is touched, not glanced at from across a kitchen, and it has
     the height to spare -- so the finger targets grow. */
  body.subpage .track { height: 52px; }
  body.subpage .track .knob { width: 10px; height: 40px; margin-left: -5px; }
  body.subpage .dial { max-width: 180px; margin: .15rem auto .15rem; }
  /* Grid rows stretch to their tallest card. Centring a control's contents uses
     that height instead of leaving it dead under the track. */
  body.subpage .card.light, body.subpage .card.thermostat, body.subpage .card.slider {
    display: flex; flex-direction: column; justify-content: center; }
  .plinks { display: inline-flex; gap: .7rem; }

  /* Config problem, shown without blanking a wall display that still works */
  .banner { margin: 1rem 1.4rem -.2rem; padding: .7rem 1rem; border-radius: 12px;
    font-size: .9rem; line-height: 1.45; color: #ffc9cc;
    background: rgba(255,107,114,.12); border: 1px solid rgba(255,107,114,.35);
    border-left: 4px solid #ff6b6b; }
  .banner[hidden] { display: none; }

  .muted { color: var(--muted); font-size: .9rem; }
  .error { color: #ff8a90; }
  .notice { border-radius: 18px; padding: 1.4rem 1.6rem; line-height: 1.6; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border); }
  .notice code { color: var(--accent); }
</style>
</head>
<body>
  <div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <header>
    <div class="clock"><span class="time" id="clock">--:--</span><span class="date" id="date"></span></div>
    <div class="meta">
      <span id="status">Loading…</span>
      <button id="toggleHidden" class="toggle" type="button">Vis skjulte</button>
      <span id="pagelinks" class="plinks"></span>
      <a href="discover.html">Alle enheter</a>
    </div>
  </header>
  <div id="cfgwarn" class="banner" hidden></div>
  <main id="main"></main>

<script src="weather-symbols.js"></script>
<script>
const REFRESH_MS = 5000;
const SIZES = ['big', 'small', 'list', 'weather', 'slider', 'thermostat', 'light'];
// How long to keep showing the position we commanded while the screens travel
// there, before trusting the live reading again.
const PENDING_MS = 25000;
// Which page this is: "" for the dashboard at /, or the name of an extra page
// from config.json's `pages`, which the server serves from this same file at
// /<name>. Every fetch and every write carries it.
const PAGE = (() => {
  const p = decodeURIComponent(location.pathname.replace(/^\/+/, '').replace(/\.html$/, ''));
  return p === 'index' ? '' : p;
})();
document.body.classList.toggle('subpage', !!PAGE);

const main = document.getElementById('main');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggleHidden');
const warnEl = document.getElementById('cfgwarn');
const linksEl = document.getElementById('pagelinks');

// Links to the other room displays, straight from the config.
function setPageLinks(pages, current) {
  const html = (pages || [])
    .filter((p) => p.name !== current)
    .map((p) => `<a href="${escapeHtml(p.path)}">${escapeHtml(p.label)}</a>`)
    .join('');
  if (linksEl.innerHTML !== html) linksEl.innerHTML = html;
}

// A config.json problem the dashboard is surviving: the cards below are live
// readings, but the card *list* is whatever last parsed.
function setConfigWarning(msg) {
  warnEl.textContent = msg ? `Viser lagret oppsett — ${msg}` : '';
  warnEl.hidden = !msg;
}

// Reveal cards normally hidden by their showIf rule (disregards showIf).
let showHidden = localStorage.getItem('showHidden') === '1';
function syncToggle() {
  toggleBtn.classList.toggle('active', showHidden);
  toggleBtn.textContent = showHidden ? 'Skjul skjulte' : 'Vis skjulte';
}
toggleBtn.addEventListener('click', () => {
  showHidden = !showHidden;
  localStorage.setItem('showHidden', showHidden ? '1' : '0');
  syncToggle();
  lastSig = null;   // force a rebuild
  tick();
});
syncToggle();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- Clock ---------------------------------------------------------------
function updateClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('date').textContent =
    d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}

// ---- Colours -------------------------------------------------------------
function accentFor(id) {
  if (!id) return '#6aa3ff';
  if (id.startsWith('alarm_')) return '#ff6b6b';
  if (id === 'onoff') return '#36d399';
  if (id.startsWith('measure_humidity')) return '#4cc9f0';
  if (id.includes('power') || id.includes('measure_current') || id.includes('voltage')) return '#b56bff';
  if (id.startsWith('measure_co2')) return '#2ec4b6';
  if (id.startsWith('measure_luminance')) return '#ffd166';
  if (id.startsWith('measure_temperature') || id === 'target_temperature') return '#ff9f43';
  if (id === 'weather_description') return '#5eb3ff';
  if (id.startsWith('windowcoverings')) return '#ffb457';
  return '#6aa3ff';
}
function tempColor(v) {
  if (v <= 0) return '#5eb3ff';
  if (v <= 10) return '#36d3c0';
  if (v <= 18) return '#48d39a';
  if (v <= 24) return '#ffd166';
  if (v <= 29) return '#ff9f43';
  return '#ff6b6b';
}
function valueColor(cap) {
  if ((cap.id.startsWith('measure_temperature') || cap.id === 'target_temperature')
      && typeof cap.value === 'number') return tempColor(cap.value);
  return accentFor(cap.id);
}

// ---- Enum value labels ---------------------------------------------------
// Homey reports enum capabilities as their *id* ("docked"), and the app's own
// titles are English. This maps id -> Norwegian for display only: showIf still
// matches the raw id server-side, so config.json keeps working unchanged.
// Add a capability here to translate it; unknown values fall through verbatim.
const VALUE_LABELS = {
  mower_state: {
    idle: 'Venter',
    mowing: 'Klipper',
    paused: 'Pauset',
    docked: 'I dokken',
    charging: 'Lader',
    returning: 'På vei hjem',
    error: 'Feil',
    unknown: 'Ukjent',
  },
};

function valueLabel(capId, v) {
  const map = VALUE_LABELS[capId];
  if (!map || typeof v !== 'string') return v;
  const hit = map[v.trim().toLowerCase()];
  return hit === undefined ? v : hit;
}

// ---- Weather icon (reuse window.WX from weather-symbols.js) ---------------
function isDaytime() { const h = new Date().getHours(); return h >= 6 && h < 21; }
function weatherIcon(rawValue) {
  if (rawValue === null || rawValue === undefined || !window.WX) return null;
  let v = String(rawValue).trim().toLowerCase();
  if (!v) return null;
  let dn = null;
  const m = v.match(/_(day|night|polartwilight)$/);
  if (m) { dn = m[1]; v = v.replace(/_(day|night|polartwilight)$/, ''); }
  const descKey = v.replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
  const codeKey = v.replace(/[\s._]+/g, '');
  const base = window.WX.map[descKey] || window.WX.map[codeKey];
  if (!base) return null;
  let file = base;
  if (window.WX.variants.includes(base)) {
    const day = dn ? dn !== 'night' : isDaytime();
    file = base + (day ? 'd' : 'n');
  }
  return { file, label: rawValue };
}

function fmtValue(cap, cls) {
  const v = cap.value;
  if (cap.id === 'weather_description') {
    const icon = weatherIcon(v);
    if (icon) {
      const lbl = escapeHtml(icon.label);
      return `<img class="wx ${cls || ''}" src="icons/weather/${icon.file}.svg" alt="${lbl}" title="${lbl}">`;
    }
  }
  if (v === null || v === undefined) return `<span class="value" style="color:var(--muted)">—</span>`;
  if (typeof v === 'boolean') {
    const isAlarm = cap.id.startsWith('alarm_');
    if (isAlarm) return v ? '<span class="pill alarm">Alarm</span>' : '<span class="pill off">Clear</span>';
    return v ? '<span class="pill on">Ja</span>' : '<span class="pill off">Nei</span>';
  }
  if (typeof v === 'number') {
    const num = Number.isInteger(v) ? v : v.toFixed(1);
    const unit = cap.units ? `<span class="unit">${escapeHtml(cap.units)}</span>` : '';
    return `<span class="value" style="color:${valueColor(cap)}">${num}${unit}</span>`;
  }
  return `<span class="value" style="color:${valueColor(cap)}">${escapeHtml(String(valueLabel(cap.id, v)))}</span>`;
}

// ---- Writable cards: sliders, lights, thermostats ------------------------
// All three are the same machine: a value the user drags, sent on release, plus
// a switch on lights and thermostats. Per-card UI state lives here. `shown` is
// where the control sits, `pending` is a value we have commanded and are still
// waiting for the device to reach. Neither is ever overwritten by the 5 s poll
// while the user has a finger down.
const sliders = {};        // key -> ui state, for every writable card
let lastCtrl = {};         // key -> latest writable entity from /api/state

// A screen physically travels; a light level and a target temperature read back
// on the very next poll, so those give up waiting much sooner.
const FAST_PENDING_MS = 8000;

function sliderState(key) {
  if (!sliders[key]) {
    sliders[key] = { kind: 'slider', spec: null, shown: 0, pending: null, pendingAt: 0,
                     drag: false, busy: false, seq: 0, msg: '', err: false,
                     // The switch: an optimistic value with its own sequence, so
                     // a slow reply can neither flip it back under a newer tap
                     // nor strand a value write that overlapped it.
                     onoff: null, onoffAt: 0, onoffBusy: false, swSeq: 0 };
  }
  return sliders[key];
}

function pendingMs(st) { return st.kind === 'slider' ? PENDING_MS : FAST_PENDING_MS; }

// A named channel gets the same optimistic-switch treatment as a whole card,
// just kept per row.
function chanState(st, i) {
  st.ch = st.ch || {};
  if (!st.ch[i]) st.ch[i] = { onoff: null, at: 0, busy: false, seq: 0 };
  return st.ch[i];
}

// Snap to the step grid, but keep the exact limits reachable: with step 5 and
// max 97, dragging to the far end must give 97, not 95.
function snap(v, spec) {
  if (v <= spec.min) return spec.min;
  if (v >= spec.max) return spec.max;
  const stepped = Math.round((v - spec.min) / spec.step) * spec.step + spec.min;
  return Math.min(spec.max, Math.max(spec.min, Math.round(stepped * 10) / 10));
}

// ---- The gesture ---------------------------------------------------------
// The horizontal track and the thermostat's dial are dragged by the very same
// handlers; only the mapping from a pointer position to a value differs. All the
// dial's geometry comes from ARC, so the path, its length, the knob and the
// pointer maths can never drift apart.
const ARC = { cx: 100, cy: 80, r: 72, start: -135, span: 270 };
const ARC_D = 'M 49.09 130.91 A 72 72 0 1 1 150.91 130.91';
const ARC_LEN = ARC.r * ARC.span * Math.PI / 180;

function arcPoint(frac) {
  const a = (ARC.start + ARC.span * frac) * Math.PI / 180;
  return { x: ARC.cx + ARC.r * Math.sin(a), y: ARC.cy - ARC.r * Math.cos(a) };
}

function pctFromEvent(track, clientX) {
  const r = track.getBoundingClientRect();
  if (!r.width) return 0;
  return ((clientX - r.left) / r.width) * 100;
}

// Angle of the finger around the dial's centre. The gap at the bottom is
// contiguous with both ends, so clamping the angle reaches each end stop by
// itself -- drag past the end and you get the end.
function tempFromEvent(dial, clientX, clientY, spec) {
  const r = dial.getBoundingClientRect();
  if (!r.width || !r.height) return spec.min;
  const cx = r.left + r.width * (ARC.cx / 200);
  const cy = r.top + r.height * (ARC.cy / 142);
  let a = Math.atan2(clientX - cx, -(clientY - cy)) * 180 / Math.PI;
  a = Math.min(ARC.start + ARC.span, Math.max(ARC.start, a));
  return spec.min + ((a - ARC.start) / ARC.span) * (spec.max - spec.min);
}

function valueFromEvent(ctrl, ev, spec) {
  if (ctrl.classList.contains('dial')) {
    return snap(tempFromEvent(ctrl, ev.clientX, ev.clientY, spec), spec);
  }
  // A track always spans the whole of its card's range: 0-100 % for a screen or
  // a dimmer, min..max degrees for anything measured in degrees.
  const pct = pctFromEvent(ctrl, ev.clientX);
  return snap(spec.min + (pct / 100) * (spec.max - spec.min), spec);
}

// Send the value. A per-card sequence number means a slow response from an
// earlier drag can never clobber a newer one.
async function commit(key) {
  const st = sliderState(key);
  if (!st.spec) return;
  const target = st.shown;
  const seq = ++st.seq;
  st.pending = target;
  st.pendingAt = Date.now();
  st.busy = true;
  st.err = false;
  st.msg = 'Sender…';
  paintAllControls();

  const body = { key, page: PAGE };
  if (st.kind === 'thermo') body.temperature = target;
  else if (st.kind === 'light') body.level = target;
  else body.position = target;

  try {
    const res = await fetch('api/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      cache: 'no-store',
    });
    const data = await res.json().catch(() => ({}));
    if (seq !== st.seq) return;               // superseded by a newer drag
    st.busy = false;
    // A response that lands while a finger is down must not move the control --
    // report the outcome, but leave the value the user is choosing alone.
    if (!res.ok || data.ok === false) {
      st.err = true;
      st.msg = data.error ? String(data.error).slice(0, 90) : `Feil (HTTP ${res.status})`;
      if (!st.drag) st.pending = null;         // fall back to the live reading
    } else {
      const got = st.kind === 'thermo' ? data.temperature
                : st.kind === 'light' ? data.level
                : data.position;
      if (!st.drag && typeof got === 'number') { st.pending = got; st.shown = got; }
      const failed = (data.results || []).filter(r => !r.ok);
      st.err = failed.length > 0;
      // On success the readout itself is the feedback, so no message.
      st.msg = failed.length
        ? `${failed[0].name || 'Enhet'}: ${failed[0].error}`.slice(0, 90) +
          (failed.length > 1 ? ` (+${failed.length - 1})` : '')
        : '';
    }
  } catch (err) {
    if (seq !== st.seq) return;
    st.busy = false; st.err = true;
    if (!st.drag) st.pending = null;
    st.msg = 'Ingen forbindelse';
  }
  paintAllControls();
  tick();
}

// Drag / tap on a track or a dial. Listeners live on the document so cards can
// be rebuilt without rebinding anything.
let dragKey = null;
let dragEl = null;

function onDown(ev) {
  const ctrl = ev.target.closest && ev.target.closest('.track[data-key], .dial[data-key]');
  if (!ctrl) return;
  const key = ctrl.dataset.key;
  const st = sliderState(key);
  if (!st.spec) return;
  dragKey = key;
  dragEl = ctrl;
  st.drag = true;
  st.shown = valueFromEvent(ctrl, ev, st.spec);
  ctrl.classList.add('dragging');
  if (ctrl.setPointerCapture && ev.pointerId !== undefined) {
    try { ctrl.setPointerCapture(ev.pointerId); } catch {}
  }
  ev.preventDefault();
  paintAllControls();
}

function onMove(ev) {
  if (!dragKey || !dragEl) return;
  const st = sliderState(dragKey);
  if (!st.spec) return;
  st.shown = valueFromEvent(dragEl, ev, st.spec);
  ev.preventDefault();
  paintAllControls();
}

function onUp() {
  if (!dragKey) return;
  const key = dragKey;
  const el = dragEl;
  dragKey = null;
  dragEl = null;
  const st = sliderState(key);
  st.drag = false;
  if (el) el.classList.remove('dragging');
  commit(key);                               // one command, on release
}

if (window.PointerEvent) {
  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
} else {
  // Older cast/webview runtimes without Pointer Events.
  document.addEventListener('touchstart', (e) => onDown({
    target: e.target, clientX: e.touches[0].clientX, clientY: e.touches[0].clientY,
    preventDefault: () => e.preventDefault() }));
  document.addEventListener('touchmove', (e) => onMove({
    clientX: e.touches[0].clientX, clientY: e.touches[0].clientY,
    preventDefault: () => e.preventDefault() }));
  document.addEventListener('touchend', onUp);
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// The control in a card's header or channel row: a switch when the device can
// actually be written, otherwise a plain state pill. Shared by lights and
// thermostats. `ch` addresses one named channel; omit it for the whole card.
function switchEl(ent, ch) {
  const setable = ch ? ch.setable !== false : ent.onoffSetable !== false;
  if (!setable) return `<span class="pill state off">—</span>`;
  const attr = ch ? ` data-ch="${ch.index}"` : '';
  const label = ch ? `${escapeHtml(ch.name)} av/på` : 'Av/på';
  return `<button class="sw" type="button" data-key="${escapeHtml(ent.key)}"${attr} aria-label="${label}"><span class="kn"></span></button>`;
}

// Reconcile one switch (or its read-only pill) against a live value.
function paintOneSwitch(scope, on, busy, setable) {
  const sw = scope.querySelector('.sw');
  if (sw) {
    sw.classList.toggle('on', on === true);
    sw.classList.toggle('busy', !!busy);
    sw.disabled = setable === false;
    return;
  }
  const pill = scope.querySelector('.pill.state');
  if (!pill) return;
  const cls = 'pill state ' + (on === true ? 'on' : 'off');
  if (pill.className !== cls) pill.className = cls;
  const txt = on === true ? 'På' : on === false ? 'Av' : '—';
  if (pill.textContent !== txt) pill.textContent = txt;
}

// Repaint the dot on a card that is never re-rendered, or it freezes at
// whatever it was when the card was first built.
function paintDot(el, ent) {
  const dotEl = el.querySelector('.dot');
  if (!dotEl) return;
  const cls = 'dot ' + dotClass(ent);
  if (dotEl.className !== cls) dotEl.className = cls;
  const t = dotTitle(ent);
  if (dotEl.title !== t) dotEl.title = t;
}

// Move `shown` towards the live reading, unless the user is dragging or we are
// still waiting for something we commanded to arrive.
function settleValue(st, live) {
  if (st.drag) return;
  if (st.pending !== null) {
    const tol = Math.max(st.spec.step, st.kind === 'slider' ? 3 : 0.5);
    const arrived = live !== null && Math.abs(live - st.pending) <= tol;
    if (arrived || Date.now() - st.pendingAt > pendingMs(st)) {
      st.pending = null;
      if (live !== null) st.shown = live;
    }
  } else if (live !== null) {
    st.shown = live;
  }
}

// ---- Slider (one or more screens on one track) ---------------------------
// Static skeleton -- values are filled in by paintSlider so the card never gets
// its innerHTML replaced under a moving finger.
function renderSlider(ent) {
  const title = escapeHtml(ent.label);
  const key = escapeHtml(ent.key);
  return `<div class="head">
      <span class="title">${title}</span>
      <span class="pos">—</span>
      ${dot(ent)}
    </div>
    <div class="track" data-key="${key}">
      <div class="fill"></div>
      <div class="knob"></div>
    </div>
    <div class="srow">
      <span class="sstat"></span>
    </div>`;
}

function paintSlider(el, ent) {
  const st = sliderState(ent.key);
  st.kind = 'slider';
  st.spec = { min: ent.min, max: ent.max, step: ent.step };
  const live = typeof ent.position === 'number' ? ent.position : null;
  settleValue(st, live);

  const shown = snap(st.shown, st.spec);
  const posEl = el.querySelector('.pos');
  const fill = el.querySelector('.fill');
  const knob = el.querySelector('.knob');
  const stat = el.querySelector('.sstat');
  paintDot(el, ent);
  if (!posEl || !fill || !knob) return;

  posEl.innerHTML = `${Math.round(shown)}<span class="unit">%</span>`;
  posEl.classList.toggle('stale', st.pending !== null || st.drag);
  fill.style.width = shown + '%';
  knob.style.left = shown + '%';

  if (stat) {
    let msg = st.msg;
    if (!st.busy && !st.err) {
      if (st.pending !== null) msg = live !== null ? `på vei (${Math.round(live)} %)` : 'på vei';
      else if (ent.warning) msg = 'ingen kontakt med enheten';
      else if (ent.mixed) msg = 'ulik posisjon';
      else msg = '';
    }
    const bad = (ent.members || []).filter(m => m.missing || !m.available || m.hasCapability === false);
    if (!msg && bad.length) {
      msg = bad.length === 1
        ? `${bad[0].label || bad[0].name}: utilgjengelig`
        : `${bad.length} utilgjengelige`;
    }
    stat.textContent = msg || '';
    stat.classList.toggle('err', !!st.err);
  }
}

// ---- Light (a switch, and a dim track when the lamp has one) -------------
function renderLight(ent) {
  const title = escapeHtml(ent.label);
  const key = escapeHtml(ent.key);
  if (ent.missing) {
    return `<div class="head"><span class="title">${title}</span>${dot(ent)}</div>
      <div class="single"><span class="muted error">Not found (${escapeHtml(ent.deviceId)})</span></div>`;
  }
  // Named channels replace the single header switch with a row each.
  const chans = (ent.channels || []).length
    ? `<div class="chans">${ent.channels.map((c, i) => `<div class="crow" data-ch="${i}">
          <span class="cname">${escapeHtml(c.name)}</span>
          ${switchEl(ent, { ...c, index: i })}
        </div>`).join('')}</div>`
    : '';
  if (chans) {
    return `<div class="head"><span class="title">${title}</span>${dot(ent)}</div>
      ${chans}
      ${ent.hasDim ? `<div class="track" data-key="${key}"><div class="fill"></div><div class="knob"></div></div>` : ''}
      <div class="srow"><span class="sstat"></span></div>`;
  }
  if (!ent.hasDim) {
    return `<div class="head">
        <span class="title">${title}</span>
        ${dot(ent)}
        ${switchEl(ent)}
      </div>
      <div class="srow"><span class="sstat"></span></div>`;
  }
  return `<div class="head">
      <span class="title">${title}</span>
      <span class="pos">—</span>
      ${dot(ent)}
      ${switchEl(ent)}
    </div>
    <div class="track" data-key="${key}">
      <div class="fill"></div>
      <div class="knob"></div>
    </div>
    <div class="srow"><span class="sstat"></span></div>`;
}

function paintLight(el, ent) {
  const st = sliderState(ent.key);
  st.kind = 'light';
  st.spec = { min: ent.min, max: ent.max, step: ent.step };
  settleValue(st, typeof ent.level === 'number' ? ent.level : null);

  const on = settleSwitch(st, ent);
  paintDot(el, ent);
  paintSwitch(el, st, ent, on);
  paintChannels(el, st, ent);

  const posEl = el.querySelector('.pos');
  const fill = el.querySelector('.fill');
  const knob = el.querySelector('.knob');
  if (ent.hasDim && posEl && fill && knob) {
    const shown = snap(st.shown, st.spec);
    posEl.innerHTML = `${Math.round(shown)}<span class="unit">%</span>`;
    posEl.classList.toggle('stale', st.pending !== null || st.drag);
    // Off keeps showing the level the lamp will come back on at, but stops
    // claiming the room is lit.
    posEl.classList.toggle('dim-off', on === false);
    fill.style.width = shown + '%';
    fill.style.filter = on === false ? 'grayscale(.9)' : '';
    fill.style.opacity = on === false ? '.45' : '';
    knob.style.left = shown + '%';
  }

  paintStat(el, st, ent, ent.mixed ? 'ulik' : '');
}

// ---- Thermostat (a switch and a target temperature on a dial) ------------
function renderThermo(ent) {
  const title = escapeHtml(ent.label);
  const key = escapeHtml(ent.key);
  if (ent.missing) {
    return `<div class="head"><span class="title">${title}</span>${dot(ent)}</div>
      <div class="single"><span class="muted error">Not found (${escapeHtml(ent.deviceId)})</span></div>`;
  }
  const p0 = arcPoint(0);
  return `<div class="head">
      <span class="title">${title}</span>
      ${dot(ent)}
      ${switchEl(ent)}
    </div>
    <svg class="dial" data-key="${key}" viewBox="0 0 200 142">
      <rect width="200" height="142" fill="transparent"></rect>
      <path class="bg" d="${ARC_D}" stroke-width="14"></path>
      <path class="val" d="${ARC_D}" stroke-width="14"
            stroke-dasharray="${ARC_LEN.toFixed(2)}" stroke-dashoffset="${ARC_LEN.toFixed(2)}"></path>
      <circle class="knob" r="8" fill="#fff" cx="${p0.x.toFixed(2)}" cy="${p0.y.toFixed(2)}"></circle>
      <text class="num" x="${ARC.cx}" y="92" font-size="46">—</text>
      <text class="deg" x="${ARC.cx}" y="114" font-size="14">${escapeHtml(ent.units || '°C')}</text>
    </svg>
    <div class="srow"><span class="sstat"></span></div>`;
}

function paintThermo(el, ent) {
  const st = sliderState(ent.key);
  st.kind = 'thermo';
  st.spec = { min: ent.min, max: ent.max, step: ent.step };
  settleValue(st, typeof ent.target === 'number' ? ent.target : null);

  const on = settleSwitch(st, ent);
  paintDot(el, ent);
  paintSwitch(el, st, ent, on);

  const dial = el.querySelector('.dial');
  const valEl = el.querySelector('.dial .val');
  const knob = el.querySelector('.dial .knob');
  const num = el.querySelector('.dial .num');
  if (dial && valEl && knob && num) {
    const shown = snap(st.shown, st.spec);
    const range = st.spec.max - st.spec.min;
    const frac = range > 0 ? Math.min(1, Math.max(0, (shown - st.spec.min) / range)) : 0;
    // Off greys the dial but leaves it working: set a target, then switch on.
    const colour = on === false ? '#6f7b95' : tempColor(shown);
    valEl.setAttribute('stroke-dashoffset', (ARC_LEN * (1 - frac)).toFixed(2));
    valEl.setAttribute('stroke', colour);
    const p = arcPoint(frac);
    knob.setAttribute('cx', p.x.toFixed(2));
    knob.setAttribute('cy', p.y.toFixed(2));
    num.textContent = Number.isInteger(shown) ? String(shown) : shown.toFixed(1);
    num.setAttribute('fill', colour);
    dial.classList.toggle('off', on === false);
    dial.classList.toggle('pend', st.pending !== null || st.drag);
  }

  paintStat(el, st, ent, ent.targetSetable === false ? 'kan ikke stilles' : '');
}

// ---- Switch and status row, shared by lights and thermostats -------------
// The switch answers the finger straight away; that optimistic value stands
// until the poll agrees with it, then gives up rather than lying forever.
function settleSwitch(st, ent) {
  if (st.onoff !== null && !st.onoffBusy &&
      (ent.onoff === st.onoff || Date.now() - st.onoffAt > FAST_PENDING_MS)) {
    st.onoff = null;
  }
  return st.onoff === null ? ent.onoff : st.onoff;
}

function paintSwitch(el, st, ent, on) {
  const head = el.querySelector('.head');
  if (head) paintOneSwitch(head, on, st.onoffBusy, ent.onoffSetable);
}

// One row per named channel, each with its own optimistic state.
function paintChannels(el, st, ent) {
  (ent.channels || []).forEach((c, i) => {
    const row = el.querySelector(`.crow[data-ch="${i}"]`);
    if (!row) return;
    const cs = chanState(st, i);
    // A capability write reads back on the next poll. A flow action card is
    // fire-and-forget — whether the device reports the change, and how fast, is
    // the app's business — so hold what we commanded a good deal longer before
    // falling back to whatever the capability still says.
    const hold = c.viaFlow ? 30000 : FAST_PENDING_MS;
    if (cs.onoff !== null && !cs.busy &&
        (c.onoff === cs.onoff || Date.now() - cs.at > hold)) {
      cs.onoff = null;
    }
    paintOneSwitch(row, cs.onoff === null ? c.onoff : cs.onoff, cs.busy, c.setable);
  });
}

// The only place a failed write is ever shown. `extra` is the card's own note
// for when there is nothing more urgent to say.
function paintStat(el, st, ent, extra) {
  const stat = el.querySelector('.sstat');
  if (!stat) return;
  let msg = st.msg;
  if (!st.busy && !st.onoffBusy && !st.err) {
    if (st.pending !== null) msg = 'sender…';
    else if (ent.available === false) msg = 'utilgjengelig';
    else if (ent.warning) msg = 'ingen kontakt med enheten';
    else if (ent.partial) msg = 'delvis utilgjengelig';
    else msg = extra || '';
  }
  stat.textContent = msg || '';
  stat.classList.toggle('err', !!st.err);
}

async function toggleSwitch(key, chIdx) {
  const st = sliderState(key);
  const ent = lastCtrl[key];
  if (!ent || ent.missing) return;
  // A channel row and the card's own switch behave identically; they just keep
  // their state in different places.
  const ch = chIdx === null ? null : (ent.channels || [])[chIdx];
  if (chIdx !== null && !ch) return;
  const cs = ch ? chanState(st, chIdx) : null;
  if ((ch ? ch.setable : ent.onoffSetable) === false) return;
  const cur = ch ? (cs.onoff === null ? ch.onoff : cs.onoff)
                 : (st.onoff === null ? ent.onoff : st.onoff);
  const next = !cur;
  const seq = ch ? ++cs.seq : ++st.swSeq;
  if (ch) { cs.onoff = next; cs.at = Date.now(); cs.busy = true; }
  else { st.onoff = next; st.onoffAt = Date.now(); st.onoffBusy = true; }
  st.err = false;
  st.msg = '';
  paintAllControls();

  const body = { key, page: PAGE, onoff: next };
  if (ch) body.channel = chIdx;

  try {
    const res = await fetch('api/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      cache: 'no-store',
    });
    const data = await res.json().catch(() => ({}));
    if (seq !== (ch ? cs.seq : st.swSeq)) return;   // superseded by a newer tap
    if (ch) cs.busy = false; else st.onoffBusy = false;
    const revert = () => { if (ch) cs.onoff = null; else st.onoff = null; };
    if (!res.ok || data.ok === false) {
      revert();                               // fall back to the live reading
      st.err = true;
      st.msg = data.error ? String(data.error).slice(0, 90) : `Feil (HTTP ${res.status})`;
    } else {
      const failed = (data.results || []).filter(r => !r.ok);
      st.err = failed.length > 0;
      st.msg = failed.length ? String(failed[0].error).slice(0, 90) : '';
      if (failed.length) revert();
    }
  } catch (err) {
    if (seq !== (ch ? cs.seq : st.swSeq)) return;
    if (ch) { cs.busy = false; cs.onoff = null; } else { st.onoffBusy = false; st.onoff = null; }
    st.err = true;
    st.msg = 'Ingen forbindelse';
  }
  paintAllControls();
  tick();
}

document.addEventListener('click', (ev) => {
  const sw = ev.target.closest && ev.target.closest('.sw[data-key]');
  if (!sw || sw.disabled) return;
  const ch = sw.dataset.ch;
  toggleSwitch(sw.dataset.key, ch === undefined ? null : Number(ch));
});

// DOM id for a card. The server's `key` is derived from the entry's position in
// config.json, so it survives cards appearing and disappearing.
function cardId(ent) {
  return 'card-' + String(ent.key).replace(/[^a-zA-Z0-9_-]/g, '-');
}
function cardEl(ent) { return document.getElementById(cardId(ent)); }

// Every writable card repaints together: one gesture can only touch one card,
// but the drag handlers don't need to know which kind it was.
function paintAllControls() {
  for (const ent of Object.values(lastCtrl)) {
    const el = cardEl(ent);
    if (!el) continue;
    if (ent.size === 'slider') paintSlider(el, ent);
    else if (ent.size === 'thermostat') paintThermo(el, ent);
    else if (ent.size === 'light') paintLight(el, ent);
  }
}

function dot(ent) {
  return `<span class="dot ${dotClass(ent)}" title="${dotTitle(ent)}"></span>`;
}

// Green / amber / red. Amber only ever comes from a multi-device slider card
// where some members are reachable and some are not.
function dotClass(ent) {
  if (ent.missing || ent.available === false) return 'bad';
  if ((ent.capabilities || []).some(c => c.id.startsWith('alarm_') && c.value === true)) return 'bad';
  // Homey leaves `available: true` on a device it can no longer reach and only
  // sets a warning, so the readings below can be arbitrarily old.
  if (ent.partial || ent.warning) return 'warn';
  return 'ok';
}

function dotTitle(ent) {
  const cls = dotClass(ent);
  if (ent.warning && cls === 'warn') return ent.warning;
  if (cls === 'warn') return 'Partly unavailable';
  if (cls === 'ok') return 'Online';
  if ((ent.capabilities || []).some(c => c.id.startsWith('alarm_') && c.value === true) &&
      !ent.missing && ent.available !== false) return 'Alarm';
  return 'Unavailable';
}

function cardAccent(ent) {
  if (ent.missing) return '#ff6b6b';
  if (ent.size === 'slider' || ent.size === 'thermostat') return accentFor(ent.capability);
  // A dimmable lamp and a plain switch should look like the same kind of thing.
  if (ent.size === 'light') return accentFor('onoff');
  const caps = ent.capabilities || [];
  const alarm = caps.find(c => c.id.startsWith('alarm_'));
  return accentFor((alarm || caps[0] || {}).id);
}

function cardClass(ent) {
  const size = SIZES.includes(ent.size) ? ent.size : 'small';
  const unavail = ent.available === false ? ' unavailable' : '';
  const ghost = ent.hidden ? ' ghost' : '';
  let base;
  if (ent.missing && size !== 'slider') base = 'card small missing';
  else if (size === 'slider') base = 'card slider' + unavail + (ent.missing ? ' missing' : '');
  else if (size === 'thermostat') base = 'card thermostat' + unavail + (ent.missing ? ' missing' : '');
  else if (size === 'light') base = 'card light'
    + (ent.hasDim || (ent.channels || []).length ? '' : ' plain')
    + unavail + (ent.missing ? ' missing' : '');
  else if ((size === 'big' || size === 'small') && (ent.capabilities || []).length === 1) base = 'card single-card ' + size + unavail;
  else if (size === 'weather') base = 'card weather' + unavail;
  else if (size === 'list') base = 'card list' + unavail;
  else base = 'card ' + size + unavail;
  return base + ghost;
}

// A small "hidden" tag for revealed cards.
function hiddenTag(ent) { return ent.hidden ? '<span class="tag">hidden</span>' : ''; }

// Shown on a readout card whose device Homey can no longer reach: the number
// below it is however old it is.
function staleNote(ent) {
  return ent.warning ? '<span class="tag stale" title="' + escapeHtml(ent.warning) + '">ingen kontakt</span>' : '';
}

// Inner markup of a card (without the outer .card element), so we can update
// contents in place without re-triggering the card entry animation.
function renderInner(ent) {
  const size = SIZES.includes(ent.size) ? ent.size : 'small';
  const title = escapeHtml(ent.label);

  if (size === 'slider') return renderSlider(ent);
  if (size === 'thermostat') return renderThermo(ent);
  if (size === 'light') return renderLight(ent);
  if (ent.missing) {
    return `<div class="head"><span class="title">${title}</span>${dot(ent)}</div>
      <div class="single"><span class="muted error">Not found (${escapeHtml(ent.deviceId)})</span></div>`;
  }
  if ((size === 'big' || size === 'small') && (ent.capabilities || []).length === 1) {
    return `<div class="head"><span class="title">${title}${hiddenTag(ent)}${staleNote(ent)}</span>${dot(ent)}</div>
      <div class="single">${fmtValue(ent.capabilities[0])}</div>`;
  }
  if (size === 'weather') {
    const vals = ent.capabilities.map(c => fmtValue(c)).join('');
    return `<div class="head"><span class="title">${title}${hiddenTag(ent)}</span></div>
      <div class="wline">${vals}</div>`;
  }
  if (size === 'list') {
    const vals = ent.capabilities.length
      ? ent.capabilities.map(c => fmtValue(c)).join('')
      : '<span class="muted">No matching capabilities</span>';
    return `<div class="lrow"><span class="title">${title}${hiddenTag(ent)}</span>${dot(ent)}<span class="vals">${vals}</span></div>`;
  }
  const vals = ent.capabilities.map(c =>
    `<div class="lrow"><span class="muted">${escapeHtml(c.title)}</span><span class="vals">${fmtValue(c)}</span></div>`
  ).join('');
  return `<div class="head"><span class="title">${title}${hiddenTag(ent)}</span>${dot(ent)}</div>
    <div style="margin-top:.5rem;display:flex;flex-direction:column;gap:.45rem">${vals}</div>`;
}

let lastSig = null;       // layout signature: triggers a full rebuild when it changes
let lastInner = {};       // cached inner HTML per card key, to skip no-op updates

// tick() is called on a timer, after every commit, and by the "vis skjulte"
// toggle, so several polls can be in flight at once. Only the newest response is
// allowed to touch the DOM — otherwise a slow earlier one lands last and puts
// stale values back on screen.
let tickSeq = 0;

async function tick() {
  // Never poll mid-drag: a changed layout signature (a showIf card appearing)
  // would rebuild the grid and throw away the card being touched.
  if (dragKey) return;
  const seq = ++tickSeq;
  try {
    const url = 'api/state?page=' + encodeURIComponent(PAGE) + (showHidden ? '&showHidden=1' : '');
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    if (seq !== tickSeq || dragKey) return;   // superseded, or a drag started
    if (data.error) { statusEl.innerHTML = `<span class="error">Homey error: ${escapeHtml(data.error)}</span>`; return; }
    if (!data.configured) {
      setPageLinks(data.pages, data.page);
      setConfigWarning(null);   // the full-page notice below covers it
      main.innerHTML = data.configError
        ? `<div class="notice"><strong class="error">config.json could not be read.</strong><br>
           <code>${escapeHtml(data.configError)}</code><br>
           Fix the file and this page will pick it up within a few seconds.</div>`
        : `<div class="notice"><strong>No dashboard configured yet.</strong><br>
           Create a <code>config.json</code> and list devices. Open
           <a href="discover.html">device discovery</a> to find IDs.</div>`;
      statusEl.innerHTML = data.configError
        ? '<span class="error">Bad config</span>' : 'Not configured';
      lastSig = null;
      lastInner = {};
      return;
    }
    document.title = data.title || 'Home';
    setPageLinks(data.pages, data.page);

    const singles = data.entities.filter(e => e.size !== 'list' && e.size !== 'slider');
    const sliderEnts = data.entities.filter(e => e.size === 'slider');
    const lists = data.entities.filter(e => e.size === 'list');
    const ordered = [...singles, ...sliderEnts, ...lists];

    lastCtrl = {};
    for (const e of data.entities) {
      if (e.size === 'slider' || e.size === 'thermostat' || e.size === 'light') lastCtrl[e.key] = e;
    }

    // Deliberately value-free: the signature must not change as positions move,
    // or a rebuild would rip the card out from under a finger mid-drag.
    const sig = ordered.map(e =>
      e.key + '|' + e.size + '|' + (e.missing ? 'm' : '') + '|' + (e.hidden ? 'h' : '') +
      '|' + (e.size === 'slider' || e.size === 'thermostat' || e.size === 'light'
              ? `${e.min}-${e.max}-${e.step}${e.size === 'light' ? (e.hasDim ? '-dim' : '-plain') : ''}${e.onoffSetable === false ? '-ro' : ''}${(e.channels || []).map(c => c.name + (c.setable ? 's' : 'r')).join('~')}` : '') + '|' +
      (e.capabilities || []).map(c => c.id).join(',')).join('||');

    if (sig !== lastSig) {
      // Structure changed (cards added/removed/reordered): full rebuild (animates once).
      lastInner = {};
      const shell = (e) => {
        const inner = renderInner(e);
        lastInner[e.key] = inner;
        return `<div class="${cardClass(e)}" id="${cardId(e)}" style="--accent:${cardAccent(e)}">${inner}</div>`;
      };
      let html = '';
      if (singles.length) html += `<div class="grid">${singles.map(shell).join('')}</div>`;
      if (sliderEnts.length) html += `<div class="grid sliders">${sliderEnts.map(shell).join('')}</div>`;
      if (lists.length) html += `<div class="grid lists">${lists.map(shell).join('')}</div>`;
      main.innerHTML = html;
      lastSig = sig;
      paintAllControls();
    } else {
      // Same cards: update contents in place, only when actually changed (no blink).
      for (const e of ordered) {
        const el = cardEl(e);
        if (!el) continue;
        const cls = cardClass(e);
        if (el.className !== cls) el.className = cls;
        el.style.setProperty('--accent', cardAccent(e));
        // Writable cards are never re-rendered: their paint functions nudge the
        // few nodes that change, so a drag in progress survives the poll.
        if (e.size === 'slider') { paintSlider(el, e); continue; }
        if (e.size === 'thermostat') { paintThermo(el, e); continue; }
        if (e.size === 'light') { paintLight(el, e); continue; }
        const inner = renderInner(e);
        if (lastInner[e.key] !== inner) { el.innerHTML = inner; lastInner[e.key] = inner; }
      }
    }
    // Cards are live either way; the banner says so when they came from a cached
    // config.json because the file itself can no longer be read.
    setConfigWarning(data.configWarning);
    statusEl.textContent = `Updated ${new Date(data.updatedAt).toLocaleTimeString()}`;
  } catch (err) {
    statusEl.innerHTML = '<span class="error">Cannot reach server</span>';
  }
}

updateClock();
setInterval(updateClock, 1000);   // live ticking clock (incl. seconds)
tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
